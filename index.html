<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>کلاس آنلاین</title>

  <link rel="icon" href="data:," />

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: system-ui, Tahoma, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f4f6fb;
      color: #222;
    }

    h1 {
      text-align: center;
      font-size: 22px;
      margin: 8px 0 16px;
    }

    .card {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    select, input, button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-bottom: 10px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    #videos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    video {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: black;
      border-radius: 12px;
      object-fit: cover;
    }

    .video-box {
      position: relative;
    }

    .video-label {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,.65);
      color: white;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 13px;
    }

    #chat {
      margin-top: 16px;
      border: 1px solid #ddd;
      border-radius: 12px;
      overflow: hidden;
    }

    #messages {
      height: 180px;
      overflow-y: auto;
      padding: 10px;
      background: #fafafa;
    }

    .message {
      background: #e5e7eb;
      padding: 8px 10px;
      border-radius: 10px;
      margin-bottom: 8px;
      max-width: 85%;
    }

    .message.me {
      background: #dbeafe;
      margin-left: auto;
    }

    .sender {
      font-size: 12px;
      color: #555;
      margin-bottom: 3px;
    }

    .chat-input {
      display: flex;
      gap: 8px;
      padding: 8px;
      border-top: 1px solid #ddd;
    }

    .chat-input input {
      margin-bottom: 0;
    }

    .chat-input button {
      width: 90px;
      margin-bottom: 0;
    }

    .status {
      text-align: center;
      color: #555;
      font-size: 14px;
      margin-top: 10px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>کلاس آنلاین</h1>

    <div id="joinBox">
      <label>نقش خود را انتخاب کن</label>
      <select id="role">
        <option value="student">دانش‌آموز</option>
        <option value="teacher">معلم</option>
      </select>

      <label>اتاق را انتخاب کن</label>
      <select id="roomId">
        <option value="1">اتاق ۱</option>
        <option value="2">اتاق ۲</option>
        <option value="3">اتاق ۳</option>
        <option value="4">اتاق ۴</option>
      </select>

      <label>اسم تو</label>
      <input id="name" placeholder="مثلاً علی" />

      <button id="joinButton" onclick="joinClass()">ورود به کلاس</button>

      <p class="status">
        دانش‌آموز بدون دوربین و میکروفون می‌تواند وارد شود و صدا و تصویر معلم را ببیند.
      </p>
    </div>

    <div id="classBox" class="hidden">
      <div id="videos"></div>

      <div id="chat">
        <div id="messages"></div>

        <div class="chat-input">
          <input id="chatText" placeholder="پیام بنویس..." onkeydown="if(event.key==='Enter') sendMessage()" />
          <button onclick="sendMessage()">ارسال</button>
        </div>
      </div>

      <p class="status" id="connectionStatus"></p>
    </div>
  </div>

  <script>
    let peer;
    let teacherStream = null;
    let teacherConn = null;
    const studentConns = {};

    function getRoomId() {
      return document.getElementById('roomId').value;
    }

    function getName() {
      return document.getElementById('name').value.trim() || 'کاربر';
    }

    function showClass() {
      document.getElementById('joinBox').classList.add('hidden');
      document.getElementById('classBox').classList.remove('hidden');
    }

    function setStatus(text) {
      document.getElementById('connectionStatus').textContent = text;
    }

    function addVideo(id, stream, label, muted = false) {
      if (document.getElementById(id)) return;

      const box = document.createElement('div');
      box.className = 'video-box';
      box.id = id;

      const video = document.createElement('video');
      video.srcObject = stream;
      video.autoplay = true;
      video.playsInline = true;
      video.muted = muted;

      const nameTag = document.createElement('div');
      nameTag.className = 'video-label';
      nameTag.textContent = label;

      box.appendChild(video);
      box.appendChild(nameTag);
      document.getElementById('videos').appendChild(box);
    }

    function addMessage(sender, text, isMe = false) {
      const messages = document.getElementById('messages');

      const message = document.createElement('div');
      message.className = 'message' + (isMe ? ' me' : '');

      const senderDiv = document.createElement('div');
      senderDiv.className = 'sender';
      senderDiv.textContent = sender;

      const textDiv = document.createElement('div');
      textDiv.textContent = text;

      message.appendChild(senderDiv);
      message.appendChild(textDiv);
      messages.appendChild(message);

      messages.scrollTop = messages.scrollHeight;
    }

    function handleData(data) {
      if (data && data.type === 'chat') {
        addMessage(data.name, data.text);
      }
    }

    function sendMessage() {
      const input = document.getElementById('chatText');
      const text = input.value.trim();

      if (!text) return;

      const data = {
        type: 'chat',
        name: getName(),
        text: text
      };

      if (document.getElementById('role').value === 'teacher') {
        Object.values(studentConns).forEach(connection => {
          if (connection.open) connection.send(data);
        });
      } else if (teacherConn && teacherConn.open) {
        teacherConn.send(data);
      }

      addMessage('من', text, true);
      input.value = '';
    }

    async function joinClass() {
      const role = document.getElementById('role').value;
      const room = getRoomId();

      document.getElementById('joinButton').disabled = true;
      setStatus('در حال اتصال...');

      if (role === 'teacher') {
        await joinAsTeacher(room);
      } else {
        await joinAsStudent(room);
      }
    }

    async function joinAsTeacher(room) {
      try {
        teacherStream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: true
        });
      } catch (err) {
        alert('برای معلم بودن، دوربین و میکروفون باید در دسترس باشد.');
        document.getElementById('joinButton').disabled = false;
        setStatus('');
        return;
      }

      addVideo('teacher-video', teacherStream, 'معلم', true);

      peer = new Peer('class-room-' + room + '-teacher');

      peer.on('open', () => {
        showClass();
        setStatus('معلم وارد شد. منتظر دانش‌آموزان...');
      });

      peer.on('connection', connection => {
        studentConns[connection.peer] = connection;

        connection.on('open', () => {
          connection.send({
            type: 'chat',
            name: 'سیستم',
            text: 'به کلاس خوش آمدی.'
          });

          peer.call(connection.peer, teacherStream);
        });

        connection.on('data', handleData);

        connection.on('close', () => {
          delete studentConns[connection.peer];
        });
      });

      peer.on('error', error => {
        setStatus('خطا: ' + error.type);
      });
    }

    async function joinAsStudent(room) {
      peer = new Peer();

      const teacherId = 'class-room-' + room + '-teacher';

      peer.on('open', () => {
        teacherConn = peer.connect(teacherId, {
          reliable: true
        });

        teacherConn.on('open', () => {
          showClass();
          setStatus('وارد اتاق ' + room + ' شدی.');

          teacherConn.send({
            type: 'student-ready',
            name: getName()
          });
        });

        teacherConn.on('data', handleData);

        teacherConn.on('close', () => {
          setStatus('ارتباط با معلم قطع شد.');
        });
      });

      peer.on('call', call => {
        call.answer();

        call.on('stream', stream => {
          addVideo('teacher-video', stream, 'معلم');
        });
      });

      peer.on('error', error => {
        if (error.type === 'peer-unavailable') {
          setStatus('معلم هنوز وارد اتاق نشده است. بعد از ورود معلم، صفحه را رفرش کن.');
        } else {
          setStatus('خطا: ' + error.type);
        }
      });
    }
  </script>

</body>
</html>
